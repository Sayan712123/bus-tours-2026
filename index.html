<style>
:root{--pr:#d92777;--pd:#b81c62;--ac:#fbbf24;--ink:#1f2937;--mu:#6b7280;--bg:#fff8fb;--bd:#f1dbe6;--bk:#d1d5db;--ok:#16a34a}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,'Noto Sans Bengali',system-ui,sans-serif;line-height:1.55}
a{color:inherit}.w{max-width:880px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;line-height:1.25}h2.sec{font-size:22px;margin:34px 0 12px}
.mu{color:var(--mu);font-size:14px}.c{text-align:center}
.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.brand img{width:38px;height:38px;border-radius:10px}
.brand b{font-size:18px;color:var(--pr)}.brand i{font-style:normal;background:var(--ac);color:var(--pd);border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px;margin-left:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 20px;background:var(--pr);color:#fff;font:600 15px Poppins,sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--pd)}.btn.alt{background:#fff;color:var(--pr);border:1.5px solid var(--pr)}.btn.ye{background:var(--ac);color:#4a2a00}
.btn.wa{background:#25a244}.btn.red{background:#c92a2a}.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}.btn:disabled{opacity:.5}
.hero{background:linear-gradient(160deg,#d92777 0%,#b81c62 70%);color:#fff;padding:44px 16px 70px;text-align:center;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--ac);opacity:.9}
.hero>*{position:relative;z-index:1}.hero img{width:84px;height:84px;border-radius:22px;box-shadow:0 8px 24px #0004}
.hero h1{font-size:34px;margin:14px 0 6px}.hero p{margin:0 auto 20px;max-width:520px;opacity:.95}
.tag{letter-spacing:.3em;font-size:11px;opacity:.9}
.hero .row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.feat{margin:-48px auto 0;position:relative;z-index:2}
.card{background:#fff;border:1px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:0 6px 22px #d9277712;display:block;color:inherit;text-decoration:none}
.card .ph{width:100%;height:210px;object-fit:cover;display:block;background:linear-gradient(135deg,#fde2ee,#fff3c4)}
.pad{padding:16px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badge{font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;white-space:nowrap}
.on{background:var(--pr);color:#fff}.soon{background:#f3f4f6;color:var(--mu)}
.price{font-size:22px;font-weight:700;color:var(--pr)}.price small{font-size:12px;color:var(--mu);font-weight:400}
.bar0{height:7px;background:#f3e1ea;border-radius:9px;overflow:hidden;margin:10px 0 4px}.bar0 i{display:block;height:100%;background:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.step{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px}.step b{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--ac);color:#4a2a00;margin-bottom:8px}
.rev{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:14px;padding:14px;margin:10px 0}
details{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin:8px 0}summary{cursor:pointer;font-weight:600}details p{margin:8px 0 0;color:var(--mu)}
.foot{background:#2b1020;color:#f9d5e5;margin-top:44px;padding:30px 16px;text-align:center;font-size:14px}.foot a{color:var(--ac)}
.fab{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#25a244;color:#fff;display:grid;place-items:center;font-size:28px;text-decoration:none;box-shadow:0 6px 18px #0004;z-index:30}
.slider{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 16px}.slider img{height:240px;min-width:82%;max-width:520px;object-fit:cover;border-radius:18px;scroll-snap-align:center}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.fact{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:10px 12px}.fact span{display:block;font-size:12px;color:var(--mu)}.fact b{font-size:15px}
.sec-card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:16px;margin:14px 0}.sec-card h3{margin-bottom:8px;font-size:17px}
.ov{white-space:pre-wrap}.ul{list-style:none;padding:0;margin:0}.ul li{padding:5px 0 5px 26px;position:relative}.ul li:before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:700}.ul.x li:before{content:"✕";color:#c92a2a}
.tl{border-left:3px solid var(--ac);margin-left:8px;padding-left:16px}.tl div{position:relative;padding:6px 0 10px}.tl div:before{content:"";position:absolute;left:-23px;top:12px;width:11px;height:11px;border-radius:50%;background:var(--pr)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.two{grid-template-columns:1fr}.hero h1{font-size:28px}}
.bus{background:#fff;border:2px solid var(--bd);border-radius:28px;padding:16px;max-width:310px;margin:12px auto}
.drv{text-align:right;color:var(--mu);font-size:13px}.row{display:flex;gap:6px;justify-content:center;margin:6px 0}.gap{width:26px}
.seat{width:44px;height:44px;border-radius:10px;border:2px solid var(--pr);background:#fff;color:var(--ink);font:600 12px Poppins,sans-serif;cursor:pointer}
.seat.bk{background:var(--bk);border-color:var(--bk);color:var(--mu);cursor:not-allowed;text-decoration:line-through}
.seat.hd{background:var(--ac);border-color:var(--ac);cursor:not-allowed}.seat.sel{background:var(--pr);color:#fff}
.seat.ad.bk{background:#c92a2a;border-color:#c92a2a;color:#fff;text-decoration:none;cursor:pointer}.seat.ad.hd{cursor:pointer}
.leg{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mu);flex-wrap:wrap}.leg i{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:2px solid var(--pr)}
.sbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:12px 16px;z-index:25;box-shadow:0 -6px 20px #0001}
.sbar .in{max-width:880px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;margin:4px 0 10px;background:#fff;color:var(--ink)}
label{font-size:13px;color:var(--mu)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.warn{background:#fff3bf;color:#5c4400;border-radius:12px;padding:12px;font-size:14px;margin:12px 0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:10px 0}.gal img{width:100%;height:100px;object-fit:cover;border-radius:10px}.ct{display:flex;gap:4px;justify-content:center;margin-top:4px}
table{width:100%;font-size:13px;border-collapse:collapse}td{padding:5px;border-top:1px solid var(--bd)}
.tk{max-width:420px;margin:22px auto;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 10px 34px #d9277722;border:1px solid var(--bd)}
.tk .hd{background:linear-gradient(160deg,#d92777,#b81c62);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.tk .hd img{width:42px;height:42px;border-radius:11px}.tk .ok{background:var(--ac);color:#4a2a00;font-weight:700;font-size:12px;padding:4px 12px;border-radius:99px}
.tk .bd{padding:20px}.tk .big{font-size:22px;font-weight:700;color:var(--ink)}.tk .lbl{font-size:11px;letter-spacing:.12em;color:var(--mu);text-transform:uppercase;margin-top:14px}
.tk .v{font-weight:600}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.chips span{background:var(--pr);color:#fff;border-radius:9px;padding:4px 12px;font-weight:700}
.tk .cut{border-top:2px dashed var(--bd);margin:18px -20px;position:relative}
.tk .qr{text-align:center}.tk .qr svg{width:150px;height:150px}.tk .code{font-family:monospace;font-size:20px;font-weight:700;letter-spacing:.08em;text-align:center;margin-top:6px}
@media print{.nav,.noprint,.foot{display:none!important}body{background:#fff}.tk{box-shadow:none;margin:0 auto}}
